name: Codacy CI

# Eventos disparadores que inician la ejecución del workflow
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  codacy:
    runs-on: ubuntu-24.04
    
    # 2. Modificación: Configuración de la matriz para probar varias versiones de Python
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]

    services:
      mariadb:
        image: mariadb:12.0.2
        env:
          MARIADB_ROOT_PASSWORD: uvlhub_root_password
          MARIADB_DATABASE: uvlhubdb_test
          MARIADB_USER: uvlhub_user
          MARIADB_PASSWORD: uvlhub_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -u root -p$MARIADB_ROOT_PASSWORD"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      # Acción checkout predefinida para clonar el código en el entorno del runner
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # Usamos la variable de la matriz de Python
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ./rosemary

      # 1. Modificación: Nuevo step para verificar dependencias desactualizadas
      - name: Check for outdated dependencies
        run: pip list --outdated

      # 3. Modificación: Nuevo step para análisis de seguridad
      - name: Security scan with pip-audit
        run: |
          pip install pip-audit
          pip-audit --skip rosemary

      - name: Run tests with coverage
        run: |
          coverage run -m pytest app/features/ --ignore-glob='*selenium*'
          coverage xml
        env:
          FLASK_ENV: testing
          MARIADB_HOSTNAME: 127.0.0.1
          MARIADB_PORT: 3306
          MARIADB_TEST_DATABASE: uvlhubdb_test
          MARIADB_USER: uvlhub_user
          MARIADB_PASSWORD: uvlhub_password

      - name: Upload coverage to Codacy
        run: bash <(curl -Ls https://coverage.codacy.com/get.sh) report -r coverage.xml
        env:
          # Se extrae de los secretos del repositorio, que almacenan de manera segura tokens y contraseñas
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}