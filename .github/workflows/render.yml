name: Deploy to Render

on:
  # 3. Realizar un despliegue solo cuando se crea un tag (ej. v1.0.0)
  push:
    tags:
      - 'v*'
  # 1. Trigger para pull requests cerrados (se filtrará por los mergeados en el job)
  pull_request:
    types:
      - closed
    branches:
      - main

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5
      
      - name: Run unit tests
        # Reemplazar con el comando real de tu stack (ej. mvn test, pytest o npm test)
        run: echo "Ejecutando pruebas..."

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-24.04
    
    # 2. El despliegue solo se ejecuta si el trabajo 'test' ha pasado exitosamente
    needs: test
    
    # 1 y 3. Solo despliega si el evento es la creación de un tag o si es un PR que ha sido mergeado
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Deploy to Render
        env:
          deploy_url: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl "$deploy_url"
